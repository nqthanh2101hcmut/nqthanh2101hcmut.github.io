locale                   : "en-US"
site_theme               : "default"
title                    : "Thanh Nguyen"
title_separator          : "|"
name                     : "Thanh Nguyen"
description              : "Applied mathematics researcher working on the mathematical foundations of generative models: score-based and flow-based methods, density-estimation objectives, and optimal transport."
keywords                 : "generative models, diffusion models, score matching, flow matching, optimal transport, Schrodinger bridge, density estimation, machine learning, applied mathematics"

url                      : "https://nqthanh2101hcmut.github.io"
baseurl                  : "/personalpage"
repository               : "nqthanh2101hcmut/personalpage"

# Set to false if you do not want the "See a map of all the places I have given a talk" link
talkmap_link             : false

author:
  # To use your own photo instead of the illustration, replace with "thanh-nguyen.jpg"
  avatar                 : "ava.png"
  name                   : "Thanh Nguyen"
  bio                    : "Generative models, optimal transport, and the mathematics behind them."
  location               : "Ho Chi Minh City, Vietnam"
  employer               : "HCMUT (Bach Khoa), VNU-HCM"
  email                  : "nqthanh2101.hcmut@gmail.com"
  googlescholar          : "https://scholar.google.com/citations?hl=vi&user=O7yQnSoAAAAJ&view_op=list_works&gmla=AO4B3jsOyabnm9fv9e-vHOtZ3P70wySLc-F3JNBqpn30v_NSTsJXnvRPYuOk-NziCYEgk8m6t10Y8T0V2ppFSyaSnjYnFb-LIEbq086EOfKN"
  github                 : "nqthanh2101hcmut"
  # TODO: fill in the username part only, e.g. "thanh-nguyen-2101"
  linkedin               :
  orcid                  :
  arxiv                  :
  semantic               :
  researchgate           :
  pubmed                 :
  bluesky                :

# Groups the /publications/ page into sections. The keys below must match the
# "category:" field used in the files inside _publications/
publication_category:
  journals:
    title: "Journal Articles"
  underreview:
    title: "Manuscripts Under Review"

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"

markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : "\n\n"
incremental              : false

kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  footnote_nr            : 1
  entity_output          : as_char
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  enable_coderay         : false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      comment: true

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

sass:
  sass_dir               : _sass
  style                  : compressed

permalink                : /:categories/:title/
timezone                 : Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
